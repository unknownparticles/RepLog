schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  项目：RepLog，中文、移动端优先的健身与饮食记录 PWA。
  当前阶段仅产出设计规格，尚未实现应用。
  首版以本地离线使用为默认，完整覆盖日、周、月、季度、年度分析。
  技术决策见 changes/design-fitness-pwa/design.md，行为以各 capability spec 为准。
  遵循根目录 AGENTS.md，修改前后保持提交清晰，提交信息使用纯中文。

rules:
  specs:
    - 每个需求必须包含可验收场景，覆盖正常路径和关键失败边界。
    - 明确区分未记录、部分记录、完整记录和真实零值。
  tasks:
    - 每个任务包含完成后的验证方式；尚未实现的任务不得勾选。
